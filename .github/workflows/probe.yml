name: Vendor probe
on:
  push:
    branches: [ 'claude/**' ]
    paths: [ 'tools/probe-vendors.ps1', '.github/workflows/probe.yml' ]
jobs:
  probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        shell: pwsh
        run: ./tools/probe-vendors.ps1
