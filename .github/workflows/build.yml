name: Build & Test

on:
  push:
    branches: [ main, master, 'claude/**' ]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Test
        env:
          ITDRIVER_ONLINE_TESTS: '1'
        run: dotnet test tests/ITDriver.Core.Tests -c Release --logger "console;verbosity=normal"
      - name: Publish
        run: dotnet publish src/ITDriver.App -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=none -o publish
      - name: Installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DMyAppVersion=0.0.0 installer\ITDriver.iss
      - uses: actions/upload-artifact@v4
        with:
          name: ITDriver-win-x64
          path: publish/
      - uses: actions/upload-artifact@v4
        with:
          name: ITDriver-Setup
          path: dist/ITDriver-Setup.exe
