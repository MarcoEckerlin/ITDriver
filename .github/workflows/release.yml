name: Release

# Publish a release either by pushing a tag like v1.0.1 or by running this workflow manually
# (Actions -> Release -> Run workflow, enter the version). Running ITDriver apps find it via the GitHub API and update themselves.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version ohne v, z. B. 1.0.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Version from tag
        id: v
        shell: pwsh
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $v = if ($env:INPUT_VERSION) { $env:INPUT_VERSION.Trim().TrimStart('v') } else { $env:REF_NAME.TrimStart('v') }
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Ungueltige Version: $v" }
          echo "version=$v" >> $env:GITHUB_OUTPUT
      - name: Test
        run: dotnet test tests/ITDriver.Core.Tests -c Release
      - name: Publish
        run: dotnet publish src/ITDriver.App -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=none -p:Version=${{ steps.v.outputs.version }} -o publish
      - name: Package
        shell: pwsh
        run: |
          Copy-Item tools/Get-ITDriverInventory.ps1 publish/
          Compress-Archive -Path publish/* -DestinationPath ITDriver-win-x64.zip
          $hash = (Get-FileHash ITDriver-win-x64.zip -Algorithm SHA256).Hash
          "$hash  ITDriver-win-x64.zip" | Out-File -Encoding ascii ITDriver-win-x64.zip.sha256
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: ITDriver ${{ steps.v.outputs.version }}
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            ITDriver-win-x64.zip
            ITDriver-win-x64.zip.sha256
