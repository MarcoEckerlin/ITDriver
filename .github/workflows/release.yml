name: Release

# Push a tag like v1.0.1 to publish a release. Running ITDriver apps find it via the GitHub API and update themselves.
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Version from tag
        id: v
        shell: pwsh
        run: echo "version=$('${{ github.ref_name }}'.TrimStart('v'))" >> $env:GITHUB_OUTPUT
      - name: Test
        run: dotnet test tests/ITDriver.Core.Tests -c Release
      - name: Publish
        run: dotnet publish src/ITDriver.App -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=none -p:Version=${{ steps.v.outputs.version }} -o publish
      - name: Package
        shell: pwsh
        run: |
          Copy-Item tools/Get-ITDriverInventory.ps1 publish/
          Compress-Archive -Path publish/* -DestinationPath ITDriver-win-x64.zip
          $hash = (Get-FileHash ITDriver-win-x64.zip -Algorithm SHA256).Hash
          "$hash  ITDriver-win-x64.zip" | Out-File -Encoding ascii ITDriver-win-x64.zip.sha256
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: ITDriver ${{ steps.v.outputs.version }}
          generate_release_notes: true
          files: |
            ITDriver-win-x64.zip
            ITDriver-win-x64.zip.sha256
